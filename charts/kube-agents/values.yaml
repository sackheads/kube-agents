# Cluster-wide ValidatingAdmissionPolicies that backstop agent RBAC at apply
# time: read verbs only, no Secrets, and no cluster-scoped binding to a
# namespace-tier agent ServiceAccount. Read the header of
# templates/agent-rbac-admission-policy.yaml before relying on them — notably,
# they cannot check the rules of a *referenced* Role, and the content policy is
# evadable by a manifest that carries neither the `kube-agents/tier` label nor
# the `*-agent` naming convention.
#
# Turn off for: a cluster below Kubernetes 1.30 (where the policy API is not yet
# v1 and the install would fail), or a second kube-agents release in a cluster
# that already has these — the objects are cluster singletons with fixed names.
admissionPolicy:
  enabled: true

operator:
  enabled: true
  # Extra environment variables for the controller manager, e.g. the
  # private-registry image overrides PLATFORM_AGENT_IMAGE /
  # CREDENTIAL_PROXY_IMAGE / FLUENT_BIT_IMAGE:
  #   extraEnv:
  #     - name: FLUENT_BIT_IMAGE
  #       value: registry.corp/mirror/fluent-bit:5.0.7
  extraEnv: []
  image:
    repository: ghcr.io/gke-labs/kube-agents/k8s-operator
    tag: "" # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

litellm:
  # The agent's baked default model endpoint is
  # http://litellm.kubeagents-system.svc.cluster.local/v1 (see
  # deploy/shared/defaults/config.yaml), so a working install needs this
  # gateway. Disable only if you run your own LiteLLM (or point the agent
  # elsewhere). Mirrors k8s-operator/config/integrations/litellm/base.
  # NOTE: the namespace in that endpoint is baked — installing the release
  # into any namespace other than kubeagents-system leaves the agent unable
  # to reach the gateway rendered here.
  enabled: true
  # LLM-call telemetry to the GKE Managed OpenTelemetry collector
  # (Cloud Trace/Logging). Off by default: on clusters without the collector
  # (no gke-managed-otel namespace — e.g. a fresh gke-cluster-module cluster)
  # the otel callback's DNS failure aborts every LLM request. Enable it once
  # the managed collector exists; the NetworkPolicy already allows the egress.
  otel: false
  # model-default routes to <modelProvider>/<modelDefaultName>. Providers:
  # gemini, anthropic, openai (chatgpt needs the kustomize overlay and is
  # rejected). The provider's API key must exist in the credentials Secret.
  modelProvider: gemini
  # Empty selects the per-provider default (mirrors common.sh).
  modelDefaultName: ""
  image:
    repository: ghcr.io/berriai/litellm
    tag: v1.92.0
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi
  # NetworkPolicy and GKE managed-Prometheus PodMonitoring for the gateway;
  # disable podMonitoring off-GKE — the PodMonitoring CRD is GKE-managed, and
  # helm template/lint cannot catch its absence: a non-GKE install fails at
  # apply time.
  networkPolicy: true
  podMonitoring: true

platformAgent:
  enabled: true
  name: platform-agent
  harness:
    # Required — the install fails fast when these are left empty.
    clusterName: ""
    location: ""
    projectId: ""
  deployment:
    image:
      repository: ghcr.io/gke-labs/kube-agents/platform-agent
      tag: "" # defaults to Chart.appVersion
      pullPolicy: IfNotPresent
  security:
    # Kubernetes ServiceAccount the agent pod runs as. The Workload Identity
    # binding must target this KSA (see the chart README); the default matches
    # the provisioning scripts (k8s-operator/scripts/common.sh).
    # Ownership: with serviceAccountAnnotations set, the OPERATOR creates and
    # manages the KSA; with no annotations, the operator treats it as
    # user-managed and the CHART creates it instead.
    serviceAccountName: kubeagents-platform-agent
    # Annotations applied to that KSA, e.g. for Workload Identity:
    #   iam.gke.io/gcp-service-account: <GSA>@<project>.iam.gserviceaccount.com
    serviceAccountAnnotations: {}
    # One Google service account per GKE cluster the agent may read, each
    # provisioned by Terraform with roles/container.viewer under an IAM
    # Condition on that cluster's resource.name. The credential broker mints a
    # short-lived token for the account a request's cluster maps to, instead of
    # using the agent's own identity -- which, with a project-level
    # roles/container.viewer, reads objects in every cluster in the project.
    #
    # The terraform/examples/full-install composition fills this in from its
    # `scoped_service_accounts` output; take the values from there rather than
    # deriving the account names, since the broker matches them exactly.
    #
    # A cluster that is not listed is REFUSED, not served by a wider credential.
    # Leaving the list empty keeps the previous single-identity behaviour and
    # renders CREDENTIAL_PROXY_SCOPED_SA_POOL=0 on the broker container, so the
    # mode an install is in is readable from the Deployment.
    #
    #   scopedServiceAccounts:
    #     - projectId: my-project
    #       location: us-east4
    #       clusterName: my-cluster
    #       serviceAccountEmail: ka-my-cluster-1a2b3c4d@my-project.iam.gserviceaccount.com
    scopedServiceAccounts: []
  credentials:
    # Secret holding the agent's credential keys: API_SERVER_KEY plus the
    # model-provider key(s) (ANTHROPIC_API_KEY / GEMINI_API_KEY /
    # OPENAI_API_KEY) and optional SLACK_BOT_TOKEN / SLACK_APP_TOKEN. It must
    # exist in the release namespace before the agent pod can start.
    secretName: platform-agent-secrets
    # Convenience for dev installs: create the Secret from `data` below.
    # Prefer a pre-created Secret (external secret management) in production.
    create: false
    data: {}
  integration:
    github:
      # Target GitOps repository for the GitHub integration (owner/repo or
      # URL). Empty leaves the GitHub integration unconfigured.
      gitRepo: ""
    googleChat:
      # Requires the Chat Pub/Sub backend (provision_05_gcp_gchat.sh or
      # terraform/modules/chat-pubsub). projectId is taken from
      # platformAgent.harness.projectId.
      enabled: false
      topicName: platform-agent-chat-events
      subscriptionName: platform-agent-chat-events-sub
      # Empty list = all users allowed.
      allowedUsers: []
      homeChannel: ""
      # "default" (quiet) or "debug" (full verbosity).
      mode: default
    slack:
      # Bot/app tokens are read from credentials.secretName under the
      # SLACK_BOT_TOKEN / SLACK_APP_TOKEN keys.
      enabled: false
      allowedUsers: []
      homeChannel: ""
      homeChannelName: ""
